<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6e3d9">
  <meta name="description" content="Fields of Sumer is a farming game in development, set on the rivers of ancient Mesopotamia.">
  <title>Fields of Sumer</title>
  <link rel="preload" as="image" href="./assets/homecoming.webp" fetchpriority="high">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { color: #4a3020; background: #f6e3d9; font-family: Georgia, serif; }
    main { position: relative; isolation: isolate; min-height: 100vh; min-height: 100svh; overflow: hidden; }
    .scene { position: absolute; inset: 0; z-index: -1; }
    video { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    header { position: absolute; top: 8%; left: 30%; right: 20%; text-align: center;
      --title-delay: 2.4s; --title-duration: 2.2s; }
    h1 { margin: 0; animation: arrive var(--title-duration) ease-out var(--title-delay) backwards; }
    h1 img { display: block; width: min(100%, 32rem, 65vh); height: auto; margin: auto; }
    h1 .cuneiform { width: min(56%, 18rem, 36vh); margin-top: clamp(.3rem, .7vh, .6rem); }
    header p { margin: clamp(.4rem, 1.1vh, 1rem) 0 0; font-size: clamp(1rem, 1.5vw, 1.4rem);
      animation: arrive 1.6s ease-out calc(var(--title-delay) + var(--title-duration)) backwards; }
    .development-status { display: block; margin-top: .6em; }
    @keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
    .controls { position: absolute; bottom: max(1rem, env(safe-area-inset-bottom));
      right: max(1rem, env(safe-area-inset-right)); display: flex; gap: .5rem; }
    button { display: grid; place-items: center;
      width: 2.9rem; height: 2.9rem; border: 1px solid #f8dcab99; border-radius: 50%;
      background: #38250ee0; color: #fff5df; cursor: pointer; }
    button[hidden] { display: none; }
    #music-control { width: auto; padding: 0 1rem; border-radius: 2rem; font: inherit; }
    button:hover { background: #392411; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    button span { width: 12px; height: 15px; border-left: 4px solid; border-right: 4px solid; }
    button[data-paused] span { width: 0; height: 0; border: solid transparent;
      border-width: 8px 0 8px 12px; border-left-color: currentColor; margin-left: 2px; }
    @media (orientation: portrait) {
      main { background: linear-gradient(#ece2ef, #f9e5db 48%, #fce3c5); }
      .scene { top: auto; height: min(100%, 125vw); }
      .scene::after { content: ''; position: absolute; inset: -1px 0 auto; height: 15%;
        background: linear-gradient(#f9e5db, transparent); pointer-events: none; }
      video { object-position: 28% center; }
      header { top: max(8%, env(safe-area-inset-top)); left: 8%; right: 8%; }
    }
    @media (prefers-reduced-motion: reduce) { h1, header p { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="scene">
      <video muted loop playsinline preload="none" poster="./assets/homecoming.webp"
        aria-label="A farmer brushes golden barley beside a winding path home. Small boats pass on the river beneath a distant ziggurat."></video>
    </div>
    <header>
      <h1>
        <img src="./assets/fields-of-sumer.webp" alt="Fields of Sumer">
        <img class="cuneiform" src="./assets/fields-of-sumer-cuneiform.png" width="840" height="153" lang="sux" alt="𒀀𒊮 𒆠𒂗𒄀𒊏">
      </h1>
      <p>Come home to your fields on the banks of the Euphrates.
        <span class="development-status">In development.</span></p>
    </header>
    <audio src="./assets/background-music.mp3" loop preload="none"></audio>
    <div class="controls">
      <button type="button" id="music-control" hidden>Pause music</button>
      <button type="button" id="motion-control" hidden data-paused aria-label="Play landscape animation" title="Play landscape animation"><span aria-hidden="true"></span></button>
    </div>
  </main>
  <script>
    const video = document.querySelector('video');
    const control = document.querySelector('#motion-control');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    function updateControl() {
      const label = video.paused ? 'Play landscape animation' : 'Pause landscape animation';
      control.toggleAttribute('data-paused', video.paused);
      control.setAttribute('aria-label', label);
      control.title = label;
    }
    function play() {
      if (!video.hasAttribute('src')) video.src = './assets/homecoming.mp4';
      video.play().catch(updateControl);
    }
    control.hidden = false;
    control.addEventListener('click', () => video.paused ? play() : video.pause());
    video.addEventListener('play', updateControl);
    video.addEventListener('pause', updateControl);
    video.addEventListener('error', () => { control.hidden = true; });
    reducedMotion.addEventListener('change', () => { if (reducedMotion.matches) video.pause(); });
    const music = document.querySelector('audio');
    const musicControl = document.querySelector('#music-control');
    // Share the game's Zustand persist record on the same origin.
    const musicSettingsKey = 'sumer:music-settings';
    function readMusicSettings() {
      try {
        return JSON.parse(localStorage.getItem(musicSettingsKey))?.state ?? {};
      } catch {
        return {};
      }
    }
    let musicEnabled;
    let autoplayBlocked = false;
    function updateMusicControl() {
      musicControl.disabled = Boolean(music.error);
      musicControl.hidden = !music.error && musicEnabled && music.paused && !autoplayBlocked;
      musicControl.textContent = music.error ? 'Music unavailable'
        : !musicEnabled ? 'Turn music on' : music.paused ? 'Enable sound' : 'Turn music off';
    }
    function playMusic() {
      if (!document.hidden && musicEnabled && music.paused && !music.error) {
        music.play().catch(error => {
          if (error.name === 'NotAllowedError') autoplayBlocked = true;
          updateMusicControl();
        });
      }
    }
    function applyMusicSettings() {
      const settings = readMusicSettings();
      musicEnabled = settings.enabled !== false;
      music.volume = Number.isFinite(settings.volume) ? Math.max(0, Math.min(1, settings.volume)) : 0.3;
      if (musicEnabled) playMusic();
      else music.pause();
      updateMusicControl();
    }
    musicControl.addEventListener('click', () => {
      musicEnabled = music.paused;
      try {
        const state = { volume: music.volume, ...readMusicSettings(), enabled: musicEnabled };
        localStorage.setItem(musicSettingsKey, JSON.stringify({ state, version: 0 }));
      } catch { /* The choice still applies for this visit. */ }
      if (musicEnabled) playMusic();
      else music.pause();
      updateMusicControl();
    });
    music.addEventListener('play', () => {
      autoplayBlocked = false;
      updateMusicControl();
    });
    music.addEventListener('pause', updateMusicControl);
    music.addEventListener('error', updateMusicControl);
    window.addEventListener('storage', event => {
      if (event.key === musicSettingsKey || event.key === null) applyMusicSettings();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) music.pause();
      else playMusic();
    });
    // A browser may allow audible playback only inside a visitor gesture.
    function retryMusicOnGesture(event) {
      if (!musicControl.contains(event.target)) playMusic();
    }
    document.addEventListener('click', retryMusicOnGesture);
    document.addEventListener('keydown', retryMusicOnGesture);
    if (!reducedMotion.matches) play();
    applyMusicSettings();
  </script>
</body>
</html>
