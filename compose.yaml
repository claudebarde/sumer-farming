services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sumer
      POSTGRES_PASSWORD: sumer_dev
      POSTGRES_DB: sumer_farming
    ports:
      - "5432:5432"
    volumes:
      - sumer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumer -d sumer_farming"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sumer-postgres-data:
