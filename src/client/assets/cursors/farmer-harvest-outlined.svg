<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="35" height="35" viewBox="0 0 35 35">
  <!-- One-pixel cream rim, preserving the 45-degree clockwise sickle and tip position. -->
  <defs>
    <filter id="outline" x="0" y="0" width="35" height="35" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1" result="expanded"/>
      <feFlood flood-color="#fff8e7" result="cream"/>
      <feComposite in="cream" in2="expanded" operator="in" result="rim"/>
      <feMerge><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#outline)"><image transform="rotate(45 17.5 17.5)" width="35" height="35" xlink:href="data:image/png;base64,"/></g>
</svg>
