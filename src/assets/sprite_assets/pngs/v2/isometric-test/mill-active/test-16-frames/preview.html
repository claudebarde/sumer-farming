<!doctype html><html lang="en"><meta charset="utf-8"><title>Mill downward stroke — 16-frame draft</title>
<style>body{margin:0;background:#eae3d3;color:#34291e;font:16px system-ui;text-align:center}main{max-width:800px;margin:auto;padding:24px}h1{font-size:22px}img{display:block;width:min(100%,650px);margin:-60px auto -90px;pointer-events:none}button,input{position:relative;margin:8px;padding:10px}input{width:65%}p{max-width:620px;margin:16px auto;line-height:1.5}small{display:block}</style>
<main><h1>Mill downward stroke</h1><small>16-frame draft · approved start and end proportions</small><img id="sprite" alt="Farmer pushing the mill lever" src="mill-farmer-down-01.png"><div><button id="play">Play stroke</button><input id="frame" type="range" min="1" max="16" value="1"><span id="count">01 / 16</span></div><p>The mill is the same copied layer in every frame. Generated farmer scale, lever length and foot contact still vary between poses; this draft needs further animation cleanup.</p></main>
<script>const frames=Array.from({length:16},(_,i)=>{const im=new Image();im.src=`mill-farmer-down-${String(i+1).padStart(2,'0')}.png`;return im});let timer;const slider=document.querySelector('#frame');function show(n){slider.value=n;document.querySelector('#sprite').src=frames[n-1].src;document.querySelector('#count').textContent=String(n).padStart(2,'0')+' / 16'}slider.oninput=()=>{clearInterval(timer);show(+slider.value)};document.querySelector('#play').onclick=()=>{clearInterval(timer);let n=1;show(n);timer=setInterval(()=>{show(++n);if(n===16)clearInterval(timer)},120)};</script></html>
